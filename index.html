<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chart Pattern Trainer — legal pages</title>
    <meta
      name="description"
      content="Privacy policy and terms of use for the Chart Pattern Trainer Android app."
    />
    <style>
      :root {
        color-scheme: light;
        --text: #1c1917;
        --muted: #44403c;
        --bg: #fafaf9;
        --card: #ffffff;
        --line: #d6d3d1;
        --link: #0b3a66;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        line-height: 1.25;
        font-weight: 700;
      }
      p {
        margin: 0 0 1rem;
      }
      .lede {
        color: var(--muted);
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      nav a {
        display: flex;
        align-items: center;
        min-height: 3rem;
        padding: 0.85rem 1rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        color: var(--link);
        font-weight: 650;
        text-decoration: none;
      }
      nav a:hover {
        border-color: var(--link);
      }
      nav a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Chart Pattern Trainer</h1>
      <p class="lede">
        Legal pages for the free Android app. Chart Pattern Trainer is an educational
        chart-pattern reading game.
      </p>
      <nav aria-label="Legal pages">
        <a href="privacy/">Privacy policy</a>
        <a href="terms/">Terms of use</a>
      </nav>
    </main>
  </body>
</html>
